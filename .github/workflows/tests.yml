name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Engine and rules
        run: python -B tests/test_check_action.py
      - name: Lifecycle hooks
        run: python -B tests/test_guardrail_hook.py
      - name: MCP server
        run: python -B tests/test_mcp_server.py
      - name: Policy tests (policy.yaml)
        run: python -B check_action.py --test-policy
